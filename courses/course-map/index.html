<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Protected · PhD Course Map</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #08777d;
      --accent-deep: #006b73;
      --page: #e9eeee;
      --card: #ffffff;
      --ink: #151819;
      --muted: #5d696c;
      --line: #c8d8da;
      --danger: #a13434;
      --shadow: 0 24px 70px rgba(17, 55, 58, 0.18);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #56bec2;
        --accent-deep: #8fdadc;
        --page: #090e0f;
        --card: #162124;
        --ink: #edf5f5;
        --muted: #a3b5b7;
        --line: #334649;
        --danger: #f08b8b;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.48);
      }
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 15%, rgba(102, 174, 178, 0.18), transparent 34rem),
        var(--page);
      color: var(--ink);
      font-family: Arial, "Noto Sans TC", "PingFang TC", sans-serif;
    }

    .unlock-card {
      width: min(100%, 430px);
      padding: 32px;
      border: 1px solid var(--line);
      border-top: 5px solid var(--accent);
      border-radius: 8px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent-deep);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--accent-deep);
      font-size: clamp(27px, 7vw, 36px);
      line-height: 1.12;
    }

    .description {
      margin: 14px 0 24px;
      color: var(--muted);
      line-height: 1.55;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input, button { font: inherit; }

    input {
      min-width: 0;
      height: 46px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--card);
      color: var(--ink);
    }

    input:focus-visible, button:focus-visible, a:focus-visible {
      outline: 3px solid rgba(8, 119, 125, 0.28);
      outline-offset: 2px;
    }

    button {
      height: 46px;
      padding: 0 18px;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { cursor: wait; opacity: 0.65; }

    .status {
      min-height: 1.4em;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .status.error { color: var(--danger); }

    .back-link {
      display: inline-block;
      margin-top: 22px;
      color: var(--accent-deep);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .back-link:hover { text-decoration: underline; }

    noscript {
      display: block;
      margin-top: 14px;
      color: var(--danger);
      line-height: 1.45;
    }

    @media (max-width: 480px) {
      .unlock-card { padding: 25px 20px; }
      .input-row { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="unlock-card">
    <p class="eyebrow">Protected course resource</p>
    <h1>PhD Course Map</h1>
    <p class="description">请输入访问口令以打开互动课程地图。解密只会在你的浏览器中进行。</p>

    <form id="unlockForm">
      <label for="passphrase">访问口令</label>
      <div class="input-row">
        <input id="passphrase" name="passphrase" type="password" autocomplete="current-password" required autofocus>
        <button id="unlockButton" type="submit">打开</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <noscript>此互动页面需要启用 JavaScript。</noscript>
    <a class="back-link" href="../../courses">← 返回 Courses</a>
  </main>

  <script>
    (() => {
      "use strict";

      const ITERATIONS = 310000;
      const MAGIC = "CMAP1";
      const form = document.getElementById("unlockForm");
      const input = document.getElementById("passphrase");
      const button = document.getElementById("unlockButton");
      const status = document.getElementById("status");
      let encryptedPayloadPromise;

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.classList.toggle("error", isError);
      }

      async function loadEncryptedPayload() {
        if (!encryptedPayloadPromise) {
          encryptedPayloadPromise = fetch("./course-map.enc", { cache: "no-store" }).then(response => {
            if (!response.ok) throw new Error("payload-unavailable");
            return response.arrayBuffer();
          });
        }
        return encryptedPayloadPromise;
      }

      async function decryptPage(passphrase) {
        const payload = new Uint8Array(await loadEncryptedPayload());
        const magic = new TextDecoder().decode(payload.slice(0, MAGIC.length));
        if (magic !== MAGIC || payload.length < 64) throw new Error("payload-invalid");

        const salt = payload.slice(5, 21);
        const iv = payload.slice(21, 33);
        const encrypted = payload.slice(33);
        const keyMaterial = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(passphrase),
          "PBKDF2",
          false,
          ["deriveKey"]
        );
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: ITERATIONS, hash: "SHA-256" },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
        const plaintext = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv, tagLength: 128 },
          key,
          encrypted
        );
        return new TextDecoder("utf-8", { fatal: true }).decode(plaintext);
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();
        if (!input.value) return;

        button.disabled = true;
        input.disabled = true;
        setStatus("正在验证并解锁…");

        try {
          const page = await decryptPage(input.value);
          input.value = "";
          document.open();
          document.write(page);
          document.close();
        } catch (error) {
          console.error(error);
          const unavailable = ["payload-unavailable", "payload-invalid"].includes(error.message);
          setStatus(unavailable ? "暂时无法载入课程地图，请稍后再试。" : "口令不正确，请重新输入。", true);
          button.disabled = false;
          input.disabled = false;
          input.select();
        }
      });

      loadEncryptedPayload().catch(() => {
        setStatus("暂时无法载入课程地图，请稍后再试。", true);
      });
    })();
  </script>
</body>
</html>
